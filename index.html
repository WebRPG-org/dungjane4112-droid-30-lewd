<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="user-scalable=no">
        <link rel="icon" href="icon/icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
        <title>30 Lewd Days with My Adolescent Little Sister</title>
    </head>
    <body style="background-color: black">
	        <div id="cordova-loading" class="cordova-loading">
            <div class="spinner"></div>
        </div>
		<script type="text/javascript" src="cordova.js"></script>
        <script type="text/javascript" src="js/libs/pixi.js"></script>
        <script type="text/javascript" src="js/libs/pixi-tilemap.js"></script>
        <script type="text/javascript" src="js/libs/pixi-picture.js"></script>
        <script type="text/javascript" src="js/libs/fpsmeter.js"></script>
        <script type="text/javascript" src="js/libs/lz-string.js"></script>
        <script type="text/javascript" src="js/libs/iphone-inline-video.browser.js"></script>
        <script type="text/javascript" src="js/rpg_core.js"></script>
        <script type="text/javascript" src="js/rpg_managers.js"></script>
        <script type="text/javascript" src="js/rpg_objects.js"></script>
        <script type="text/javascript" src="js/rpg_scenes.js"></script>
        <script type="text/javascript" src="js/rpg_sprites.js"></script>
        <script type="text/javascript" src="js/rpg_windows.js"></script>
        <script type="text/javascript" src="js/plugins.js"></script>
        <script type="text/javascript" src="js/main.js"></script>
		<script>
            var sceneStarted = false;
            
            function startScene() {
                if (sceneStarted) return;
                sceneStarted = true;
                if (typeof DataEncryption !== 'undefined') {
                    DataEncryption.setupDataDecryption()
                        .then(function() {
                            document.getElementById('cordova-loading').style.display = 'none';
                            
                            if (typeof SceneManager !== 'undefined') {
                                SceneManager.run(Scene_Boot);
                            }
                        })
                        .catch(function(error) {
                            console.error('DataEncryption error:', error);
                            document.getElementById('cordova-loading').style.display = 'none';
                            
                            if (typeof SceneManager !== 'undefined') {
                                SceneManager.run(Scene_Boot);
                            }
                        });
                } else {
                    document.getElementById('cordova-loading').style.display = 'none';
                    
                    if (typeof SceneManager !== 'undefined') {
                        SceneManager.run(Scene_Boot);
                    }
                }
            }
            
            if (typeof cordova !== 'undefined') {
                var cordovaDevReady = false;
                function tryStart() {
                    if (sceneStarted) return;
                    if (cordovaDevReady && document.readyState === 'complete') startScene();
                }
                document.addEventListener('deviceready', function() {
                    cordovaDevReady = true;
                    tryStart();
                }, false);
                if (document.readyState === 'complete') {
                    tryStart();
                } else {
                    window.addEventListener('load', tryStart, false);
                }
                setTimeout(function() {
                    if (!sceneStarted) startScene();
                }, 8000);
            } else {
                // N
                document.getElementById('cordova-loading').style.display = 'none';
                
                if (typeof SceneManager !== 'undefined') {
                    SceneManager.run(Scene_Boot);
                }
            }
        </script>
    </body>
</html>
